name: Health Check — Notho

on:
  # Do not run on every push. CI and E2E already cover commits; attaching a
  # full Playwright production crawl to each main push is what filled Gmail
  # during the 2 Sep calculator restore burst.
  schedule:
    # Every 6 hours. Hourly + on-push was 24+ emails a day whenever the check
    # went red, and GitHub already deprioritises scheduled Actions under load.
    # Real uptime belongs on /api/health via an external monitor (see
    # docs/MONITORING.md), not in this inbox.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Site health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run health-check script
        run: node scripts/health-check.js
        env:
          # Signed-out visitors land on /learn. Hitting / pays a 307 and then a
          # client navigation that used to throw "Execution context was destroyed"
          # and fail a healthy site.
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.notho.co.za/learn' }}

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-screenshot
          path: health-check-screenshot.png
          retention-days: 7

      - name: Open or update the incident issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'health-check-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });

            if (open.length > 0) {
              const issue = open[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Still failing as of ${when}. [Run #${context.runNumber}](${runUrl})`,
              });
              core.setFailed(`Health check still failing — see issue #${issue.number}`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Notho health check failing (since ${when})`,
              body: [
                'The automated health check could not confirm the app is working.',
                '',
                `**First failing run:** [#${context.runNumber}](${runUrl})`,
                `**Commit:** ${context.sha.slice(0, 7)}`,
                '',
                'The run log lists which checks failed. The `App booted` check is',
                'the important one. The uploaded screenshot artifact shows what',
                'the browser actually saw.',
                '',
                'This issue updates itself on each subsequent failure and closes',
                'automatically once a run passes. Please do not close it by hand',
                'while the check is still red.',
              ].join('\n'),
              labels: [LABEL, 'bug'],
            });
            core.setFailed(`Health check failing — opened issue #${created.number}`);

      - name: Close the incident issue on recovery
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'health-check-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered. [Run #${context.runNumber}](${runUrl}) passed. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
