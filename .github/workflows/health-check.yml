name: Health Check — Notho

on:
  push:
    branches: [main]
  schedule:
    # Hourly. Was every 6 hours (an outage could hide most of a working day),
    # then */30, which was too aggressive: runs overlapped and GitHub cancelled
    # them, producing "All jobs were cancelled" emails that read as failures and
    # were pure noise. Hourly is 24 runs a day with no overlap.
    #
    # This is not the floor on detection time and is not meant to be. GitHub
    # deprioritises scheduled runs under load, so treat it as "about hourly".
    # The external uptime monitor in docs/MONITORING.md checks every 5 minutes
    # and is the only layer that does not depend on GitHub Actions.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: Site health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run health-check script
        run: node scripts/health-check.js
        env:
          # Must be the CANONICAL host. fundiapp.co.za 301s to www.notho.co.za
          # (see vercel.json), and pointing the check at the old domain makes
          # every run pay a redirect chain before the app even starts loading.
          # Bare notho.co.za also redirects to www — use www directly.
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.notho.co.za' }}

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-screenshot
          path: health-check-screenshot.png
          retention-days: 7

      # ── Alerting ──────────────────────────────────────────────────────────
      #
      # One rolling incident issue, not one per day. At the old 6-hourly cadence
      # a per-day issue was tolerable; at 48 runs a day it would bury you, and
      # an alert channel you have learned to ignore is worse than none. So:
      # first failure opens an issue, subsequent failures comment on it, and
      # recovery closes it. The issue being open is a live status indicator.
      - name: Open or update the incident issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'health-check-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });

            if (open.length > 0) {
              // Already in a known incident. Add a datapoint, don't add noise.
              const issue = open[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Still failing as of ${when}. [Run #${context.runNumber}](${runUrl})`,
              });
              core.setFailed(`Health check still failing — see issue #${issue.number}`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Notho health check failing (since ${when})`,
              body: [
                'The automated health check could not confirm the app is working.',
                '',
                `**First failing run:** [#${context.runNumber}](${runUrl})`,
                `**Commit:** ${context.sha.slice(0, 7)}`,
                '',
                'The run log lists which checks failed. The `App booted` check is',
                'the important one: if it failed, React never rendered an',
                'interactive control and users are looking at a stuck splash',
                'screen. The uploaded screenshot artifact shows what the browser',
                'actually saw.',
                '',
                'This issue updates itself on each subsequent failure and closes',
                'automatically once a run passes. Please do not close it by hand',
                'while the check is still red.',
              ].join('\n'),
              labels: [LABEL, 'bug'],
            });
            core.setFailed(`Health check failing — opened issue #${created.number}`);

      # Recovery. Without this the incident issue stays open forever and the
      # signal decays back into the 36-open-issues problem.
      - name: Close the incident issue on recovery
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'health-check-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Recovered. [Run #${context.runNumber}](${runUrl}) passed. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
