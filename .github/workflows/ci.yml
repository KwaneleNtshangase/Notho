name: CI — typecheck & build

# Fast gate that runs on every pull request (and on pushes to main) so a
# broken build or type error can never reach production. Pair this with a
# branch-protection rule requiring the "build" check on main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      # The repo has ~30 unit test files covering money maths, statement
      # parsing, budget aggregation and the localStorage migration that keeps
      # existing users' progress alive across the rebrand. Until now none of
      # them ran in CI — they only ran when someone remembered to run them
      # locally, which meant they could not stop a regression reaching main.
      #
      # Blocking on purpose. A failing test in a personal finance app is not a
      # warning; the aggregate and parser suites are the difference between a
      # correct budget and a confidently wrong one.
      #
      # Note: pass no extra arguments. Vitest treats positional args as
      # filename filters, so a stray word silently runs a subset and still
      # reports green.
      - name: Unit tests
        run: npm run test:unit

      # Surfaces high-severity advisories (like the Next.js CVEs in audit H1)
      # without letting them fail the build. A new advisory can land against a
      # dependency with no change on our side, and a blocking gate here turns
      # main red for something no commit caused — which trains people to ignore
      # a red main. Report it loudly, gate on it deliberately.
      - name: Dependency audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high | tee audit.txt
          {
            echo "### Dependency audit"
            echo
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then
              echo "No advisories at or above **high**."
            else
              echo "⚠️ Advisories found at or above **high** — review below."
              echo
              echo '```'
              cat audit.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          # Public envs are safe defaults; build does not need real secrets.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
