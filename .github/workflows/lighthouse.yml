name: Lighthouse — Performance Audit

# Weekly + manual only. A Lighthouse budget failure on every main push is
# the same class of noise as the old health-check-on-push: it emails when
# you are mid-WIP and trains you to ignore the alert. CI already gates
# typecheck/tests/build. This workflow is a performance signal, not a
# deploy gate.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ secrets.BASE_URL || 'https://www.notho.co.za' }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
